name: verify-package

# 校验发布包自洽性：载荷哈希、脚本内嵌常量、编码，以及安装脚本的安装/幂等/回滚往返。
# 两个反向自检作业证明这些判据不是"永远绿"的。
#
# 注：判据逻辑一律放在仓库脚本里（verify_package.py / ci_selftest.py），
# workflow 只负责调用 —— 避免把多行代码塞进 YAML 块标量（缩进一错就整个文件失效）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    name: 包完整性 (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行 verify_package.py
        run: python3 verify_package.py

  selftest:
    name: 反向自检 · 破坏必须被检出 (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 运行 ci_selftest.py
        run: python3 ci_selftest.py

  installer:
    name: 安装 / 幂等 / 回滚 往返 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell 语法与编码
        shell: pwsh
        run: |
          $raw = [IO.File]::ReadAllBytes("install_zh.ps1")
          if (-not ($raw[0] -eq 0xEF -and $raw[1] -eq 0xBB -and $raw[2] -eq 0xBF)) {
            throw "install_zh.ps1 缺少 UTF-8 BOM"
          }
          $err = $null
          $path = (Resolve-Path install_zh.ps1).Path
          [void][Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$err)
          if ($err -and $err.Count -gt 0) {
            throw "语法错误 $($err.Count) 处，第一处: $($err[0].Message)"
          }
          Write-Host "BOM OK / 语法 OK"

      - name: 安装 -> 幂等 -> 校验 -> 回滚 往返
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $fake = Join-Path $env:RUNNER_TEMP "fakegame"
          Remove-Item $fake -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $fake "Managed") | Out-Null

          # 摆两个假的"原版"文件，用来验证备份与回滚
          [IO.File]::WriteAllBytes((Join-Path $fake "Managed\Core.dll"), [byte[]](1..64))
          [IO.File]::WriteAllBytes((Join-Path $fake "resources.assets"), [byte[]](65..128))
          $origCore = (Get-FileHash (Join-Path $fake "Managed\Core.dll") -Algorithm SHA256).Hash
          $origAssets = (Get-FileHash (Join-Path $fake "resources.assets") -Algorithm SHA256).Hash

          $patchCore = (Get-FileHash "Managed\Core.dll" -Algorithm SHA256).Hash
          $patchAssets = (Get-FileHash "resources.assets" -Algorithm SHA256).Hash

          function Invoke-Patch([string]$a) {
            powershell -NoProfile -ExecutionPolicy Bypass -File install_zh.ps1 $a -GameData $fake
            if ($LASTEXITCODE -ne 0) { throw "install_zh.ps1 $a 退出码 $LASTEXITCODE" }
          }

          Write-Host "--- install ---"
          Invoke-Patch "install"
          if ((Get-FileHash (Join-Path $fake "Managed\Core.dll") -Algorithm SHA256).Hash -ne $patchCore) {
            throw "install 后 Core.dll 不等于补丁载荷"
          }
          if ((Get-FileHash (Join-Path $fake "resources.assets") -Algorithm SHA256).Hash -ne $patchAssets) {
            throw "install 后 resources.assets 不等于补丁载荷"
          }
          if (-not (Test-Path (Join-Path $fake "Managed\Core.dll.bak"))) { throw "未生成备份 Core.dll.bak" }
          if (-not (Test-Path (Join-Path $fake "resources.assets.bak"))) { throw "未生成备份 resources.assets.bak" }
          Write-Host "install OK（载荷就位且已备份）"

          Write-Host "--- install 再来一次（幂等）---"
          Invoke-Patch "install"
          Write-Host "幂等 OK"

          Write-Host "--- verify ---"
          Invoke-Patch "verify"
          Write-Host "verify OK"

          Write-Host "--- rollback ---"
          Invoke-Patch "rollback"
          if ((Get-FileHash (Join-Path $fake "Managed\Core.dll") -Algorithm SHA256).Hash -ne $origCore) {
            throw "rollback 后 Core.dll 未还原为原文件"
          }
          if ((Get-FileHash (Join-Path $fake "resources.assets") -Algorithm SHA256).Hash -ne $origAssets) {
            throw "rollback 后 resources.assets 未还原为原文件"
          }
          Write-Host "rollback OK（逐字节还原）"
          Write-Host "全部往返测试通过"
